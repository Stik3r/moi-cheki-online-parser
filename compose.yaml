services:
  app:
    container_name: "moi-cheki-online-parser"
    build:
      context: .

      # Переменные из файла .env
    env_file:
      - .env

      # Вариант 2: передать переменные через Docker Compose
      #environment:
      #refreshToken:
      #sourceDeviceId:
    ports:
      - "8080:8080"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
